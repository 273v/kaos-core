[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-core"
dynamic = ["version"]
description = "Core protocol, runtime, and execution infrastructure for KAOS modules"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
maintainers = [
  { name = "Michael Bommarito", email = "mike@273ventures.com" },
]
keywords = [
  "agentic",
  "mcp",
  "model-context-protocol",
  "runtime",
  "infrastructure",
  "legal-tech",
  "kaos",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1.8",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
# NTFS ACL hardening for ``CredentialStore`` on Windows. The library
# falls back to a no-op + warning when ``pywin32`` is missing on
# Windows, so this extra is opt-in for users who actually need
# owner-only credential file access on a Windows host. POSIX users
# rely on ``chmod(0o600)`` and never need this extra.
windows-secure = [
  "pywin32>=308 ; sys_platform == 'win32'",
]

# OS-native credential vaults (Tier 3 in the F2 storage hierarchy).
# ``keyring`` itself is pure-Python and BSD-licensed. On Linux it
# delegates to libsecret via SecretStorage + jeepney (also pure-
# Python, BSD); we install both so a fresh kaos-core[keyring] on
# Linux works without compiling C extensions. macOS / Windows pull
# in their native backends from ``keyring`` directly.
keyring = [
  "keyring>=25.7",
  "SecretStorage>=3.4 ; sys_platform == 'linux'",
  "jeepney>=0.9 ; sys_platform == 'linux'",
]

# Encrypted-at-rest credential file (Tier 4). Argon2id-derived KEK
# wraps a Fernet ciphertext; protects against backup / sync-leak
# scenarios that plaintext-with-0o600 doesn't (Dropbox, Time
# Machine, dotfile repo). cryptography 44+ ships native Argon2id;
# no separate argon2-cffi dep needed.
encrypted-store = [
  "cryptography>=44",
]

# OAuth flow runners (F2.4): PKCE+loopback (RFC 8252) for desktop
# CLIs, device flow (RFC 8628) for headless. Implemented against
# httpx for the token endpoint POST and stdlib asyncio for the
# loopback callback. No Authlib dep — the OAuth flows we ship are
# small enough that a generic library would add more deps than
# value.
oauth = [
  "httpx>=0.28",
]

# Umbrella extra — pulls every hardening tier + OAuth so users
# get the strongest available out of the box without enumerating
# extras.
hardened = [
  "kaos-core[keyring]",
  "kaos-core[encrypted-store]",
  "kaos-core[oauth]",
]

[dependency-groups]
# ty is pre-1.0 and changes inference between minor versions; pinning
# to a tight range avoids surprise drift between dev environments and
# CI. Bumps go through dependabot.
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
  "ty>=0.0.34,<0.1",
  # Windows-only: install pywin32 in dev/CI environments so the NTFS
  # ACL-hardening path in ``CredentialStore`` is exercised on the
  # Windows-x64 matrix leg. The marker keeps this a no-op on
  # Linux/macOS dev installs.
  "pywin32>=308 ; sys_platform == 'win32'",
  # F2.2: install keyring in dev/CI so KeyringStorage is exercised
  # on every leg (CI runners actually expose macOS Keychain and
  # Windows Credential Manager; on Linux the headless detection
  # disables the tier and the encrypted-file fallback is exercised
  # instead).
  "keyring>=25.7",
  "SecretStorage>=3.4 ; sys_platform == 'linux'",
  "jeepney>=0.9 ; sys_platform == 'linux'",
  # F2.3: cryptography for the encrypted-file tier (Argon2id +
  # Fernet). Likely already installed transitively; pinning
  # explicitly makes the dev requirement obvious to humans reading
  # the manifest.
  "cryptography>=44",
  # F2.4: httpx for the OAuth flow runners' token-endpoint POST.
  "httpx>=0.28",
]

[project.scripts]
kaos-core = "kaos_core.cli:main"

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-core"
Issues = "https://github.com/273v/kaos-core/issues"
Changelog = "https://github.com/273v/kaos-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "kaos_core/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_core",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/tests",
  "/benchmarks",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_core"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_core",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "benchmark: performance-sensitive checks",
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
]

[tool.coverage.run]
source = ["kaos_core"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_core"]

[tool.ty.src]
include = ["kaos_core", "tests"]

[tool.uv]
package = true
exclude-newer = "72 hours"

[tool.uv.exclude-newer-package]
"kaos-citations" = false
"kaos-content" = false
"kaos-core" = false
"kaos-graph" = false
"kaos-llm-client" = false
"kaos-llm-core" = false
"kaos-mcp" = false
"kaos-ml-core" = false
"kaos-names" = false
"kaos-nlp-core" = false
"kaos-nlp-transformers" = false
"kaos-office" = false
"kaos-pdf" = false
"kaos-source" = false
"kaos-tabular" = false
"kaos-web" = false

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-core"
dynamic = ["version"]
description = "Core protocol, runtime, and execution infrastructure for KAOS modules"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
keywords = [
  "agentic",
  "mcp",
  "model-context-protocol",
  "runtime",
  "infrastructure",
  "legal-tech",
  "kaos",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1.8",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.1",
]

[dependency-groups]
# ty is pre-1.0 and changes inference between minor versions; pinning
# to a tight range avoids surprise drift between dev environments and
# CI. Bumps go through dependabot.
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
  "ty>=0.0.34,<0.1",
]

[project.scripts]
kaos-core = "kaos_core.cli:main"

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-core"
Issues = "https://github.com/273v/kaos-core/issues"
Changelog = "https://github.com/273v/kaos-core/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "kaos_core/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_core",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/tests",
  "/benchmarks",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_core"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_core",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "benchmark: performance-sensitive checks",
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
]

[tool.coverage.run]
source = ["kaos_core"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_core"]

[tool.ty.src]
include = ["kaos_core", "tests"]

[tool.uv]
package = true

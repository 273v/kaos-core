name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 02:00 UTC — re-scan in case a new CVE landed against
    # an existing pinned dependency.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────── gitleaks (CLI, license-free) ──────────────
  # `gitleaks/gitleaks-action@v2` requires a paid license for
  # organization-owned repositories as of late 2025. The gitleaks CLI
  # itself is MIT-licensed and free; we run it directly via the
  # official Docker image so there is no license, no rate limit, and
  # no third-party action in our supply chain for this scan.
  #
  # Rule scope: the default open-source ruleset, plus any project-local
  # overrides in `.gitleaks.toml` and `.gitleaksignore`.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks (Docker, no license required)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source /repo \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

  # ────────────── pip-audit ──────────────
  # Scan the locked dependency set for known CVEs. PyPA-maintained
  # tooling that consults the Python Packaging Advisory Database (PyPA)
  # plus OSV.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev --python 3.13

      - name: Export installed dependency set to requirements.txt
        # pip-audit reads requirements.txt; uv export gives us the
        # exact resolved set, locked to versions, including
        # transitive dependencies.
        run: uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt

      - name: Run pip-audit
        # Direct uvx invocation keeps the audit on the same Python
        # toolchain as the project, instead of the action's bundled
        # interpreter.
        run: |
          uvx --python 3.13 --from pip-audit pip-audit \
            --requirement /tmp/requirements.txt \
            --strict

  # ────────────── bandit (AST-level static security) ──────────────
  # AST-level scan for common Python security antipatterns (hardcoded
  # passwords, weak crypto, shell injection, eval, pickle, etc.).
  # Mirrors the pre-commit hook so the public PR signal matches what
  # ran locally. Medium severity + medium confidence to filter noise.
  #
  # Skipped rules (justified per audit):
  #   B101 — `assert` statements: pytest assertions are the test
  #          framework, not a security claim.
  #   B404 — `import subprocess`: intentional use (KAOS subprocess
  #          sandbox + tool integrations).
  #   B603 — subprocess without `shell=True`: correct usage
  #          (shell=False is the safer default we deliberately pick).
  #   B607 — partial-path subprocess invocation: only used for
  #          known-safe binaries (`python`, `git`).
  bandit:
    name: bandit (static security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security-bandit-py3.13

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Run bandit
        run: |
          uvx --python 3.13 bandit \
            --recursive \
            --skip B101,B404,B603,B607 \
            --severity-level medium \
            --confidence-level medium \
            kaos_core

  # ────────────── vulture (dead-code detection) ──────────────
  # Reports names vulture is 100% confident are unreachable. The
  # ``--ignore-names`` list carves out known-but-statically-invisible
  # names (framework callbacks, MCP ``_meta`` keys, signal handlers,
  # OAuth field names accessed by string, etc.) that vulture can't
  # infer from import graph alone. Mirrors the pre-commit hook.
  vulture:
    name: vulture (dead-code scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Run vulture
        run: |
          uvx --python 3.13 vulture \
            kaos_core \
            --min-confidence 100 \
            --ignore-names client_id,scopes,authorization_endpoint,token_endpoint,device_authorization_endpoint,url,open_ch,container_tag,message_id,parent_message_id,kwargs,context_id,frame,signum,exc_type,tb
